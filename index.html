<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Content Security Policy:
      - script-src 'self': only our own bundled scripts
      - connect-src: Firebase Auth + Firestore endpoints only
      - style-src 'self' 'unsafe-inline': Tailwind injects inline styles
      Tighten further in production by adding nonces.
    -->
    <meta http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        script-src 'self' 'unsafe-inline' 'unsafe-eval' https://maps.googleapis.com;
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
        connect-src 'self'
          https://*.googleapis.com
          https://*.firebaseio.com
          https://*.cloudfunctions.net
          https://identitytoolkit.googleapis.com
          https://securetoken.googleapis.com
          https://api.openweathermap.org
          https://api.sunrise-sunset.org;
        img-src 'self' data: https://lh3.googleusercontent.com https://maps.googleapis.com https://maps.gstatic.com;
        font-src 'self' https://fonts.gstatic.com;
      "
    />
    <title>WanderBoard</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
