<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Content Security Policy:
      - script-src 'self': only our own bundled scripts
      - connect-src: Firebase Auth + Firestore endpoints only
      - style-src 'self' 'unsafe-inline': Tailwind injects inline styles
      Tighten further in production by adding nonces.
    -->
    <meta http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        script-src 'self' 'unsafe-inline' 'unsafe-eval' https://maps.googleapis.com;
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
        connect-src 'self'
          https://*.googleapis.com
          https://*.firebaseio.com
          https://*.cloudfunctions.net
          https://identitytoolkit.googleapis.com
          https://securetoken.googleapis.com
          https://api.openweathermap.org
          https://api.sunrise-sunset.org;
        img-src 'self' data:
          https://lh3.googleusercontent.com
          https://maps.googleapis.com
          https://maps.gstatic.com
          https://images.unsplash.com
          https://i.pravatar.cc;
        font-src 'self' https://fonts.gstatic.com;
      "
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;0,9..144,800;1,9..144,400;1,9..144,600;1,9..144,700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
    <title>WanderBoard</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
